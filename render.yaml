services:
  - type: web
    name: hotel-booking-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard to the Neon connection string
      - key: CLERK_SECRET_KEY
        sync: false # set manually in the Render dashboard
      - key: API_KEY
        sync: false # set manually in the Render dashboard
      - key: VERCEL_TOKEN
        sync: false # set manually in the Render dashboard -- a Vercel personal access token, scoped to the robert-okoroafors-projects team
      - key: VERCEL_TEAM_ID
        value: team_IcqvHykk4CZRv090ChuNAzyT
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard -- enables Claude-drafted event-inquiry replies; unset = feature reports configured:false and generation is skipped
      - key: ANTHROPIC_MODEL
        value: claude-opus-5 # Claude model used for inquiry drafts; override here to pin a different one
