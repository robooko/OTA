services:
  - type: web
    name: hotel-booking-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard to the Neon connection string
      - key: CLERK_SECRET_KEY
        sync: false # set manually in the Render dashboard
      - key: API_KEY
        sync: false # set manually in the Render dashboard
